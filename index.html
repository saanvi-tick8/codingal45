<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width-device-width,intial-scale=1.0" />
    <title>my personal file</title>
    <link rel="stylesheet" href="./style.css" />
    
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
</head>
<body class="py-4">

  <div class="container">
    <h1 class="mb-1">My Favourite Person Profile</h1>
    <p class="text-muted mb-4">Introduction to Objects in JavaScript</p>
    <button onClick="prof()">click me!!</button>

  
    <div class="card shadow-sm mb-3" >
      <div class="card-body">
        <h5 class="card-title" >Profile Details</h5>
        <ul class="list-group list-group-flush">
          <li class="list-group-item"><span class="card-label d-block">Name</span><strong id="name">-</strong></li>
          <li class="list-group-item"><span class="card-label d-block">Relationship</span><strong id="relationship">-</strong></li>
          <li class="list-group-item"><span class="card-label d-block">Favourite Activity</span><strong id="activity">-</strong></li>
          <li class="list-group-item"><span class="card-label d-block">City</span><strong id="city">-</strong></li>
        </ul>
      </div>
    </div>

    
    <div class="card shadow-sm" >
      <div class="card-body">
        <h3 >JavaScript Object Used</h3>
        <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
